<!doctype html><html><head><title>Results</title></head>
<body><main><h1 id="for"></h1><ul id="list"></ul><button id="more">Load more</button></main>
<script>
const q = new URLSearchParams(location.search).get('q') || '';
document.getElementById('for').textContent = 'Results for ' + q;
let n = 0;
const add = (k) => { for (let i = 0; i < k; i++) { const li = document.createElement('li'); li.className = 'item'; li.textContent = q + ' ' + (++n); document.getElementById('list').append(li); } };
add(3);
document.getElementById('more').onclick = () => { if (n < 9) setTimeout(() => add(3), 200); else document.getElementById('more').remove(); };
</script></body></html>
