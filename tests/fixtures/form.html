<!doctype html><html><head><meta charset="utf-8"><title>Sign up</title></head><body><main>
<h1>Create your account</h1>
<form>
  <label>Full name <input name="name" id="name"></label><br>
  <label>Email <input name="email" type="email" id="email"></label><br>
  <label>Password <input name="password" type="password" id="pw"></label><br>
  <label>Card number <input name="cc-number" id="cc"></label><br>
  <textarea id="notes" rows="3" aria-label="Notes about you">I like tea and long walks.</textarea>
</form>
</main></body></html>
