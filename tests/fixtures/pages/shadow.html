<!doctype html><html><head><meta charset="utf-8"><title>Headphones – ShadowShop</title></head><body>
<main><h1>Noise-cancelling headphones</h1><div id="grid"></div></main>
<script>
  // Product cards as web components with open shadow roots (their text isn't in the light DOM).
  customElements.define('product-card', class extends HTMLElement {
    connectedCallback() {
      const r = this.attachShadow({ mode: 'open' });
      r.innerHTML = `<article class="card"><h3 class="name"><a href="/p/${this.dataset.id}">${this.dataset.name}</a></h3><span class="price">$${this.dataset.price}</span></article>`;
    }
  });
  for (const [id, name, price] of [[1, 'QuietMax 700', '279.00'], [2, 'Hush Pro 2', '199.99'], [3, 'Silencio X', '349.50'], [4, 'CalmWave Lite', '149.00']])
    document.getElementById('grid').insertAdjacentHTML('beforeend', `<product-card data-id="${id}" data-name="${name}" data-price="${price}"></product-card>`);
</script></body></html>
