<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Homegrown reader</title>
  <script src="ui/theme.js"></script>
    <link rel="stylesheet" href="reader.css">
</head>
<body>
  <header>
    <span class="brand"><i class="hg-mark" data-size="24"></i> Homegrown reader</span>
    <label class="pick">Open files <input id="file" type="file" multiple accept=".pdf,.epub,.docx,.txt,.md,.csv,.json,.html,.htm"></label>
  </header>
  <main id="doc" tabindex="-1">
    <p class="hint">Drop a PDF, Word (.docx), text, Markdown, CSV, JSON or HTML file here, or open one above. Open up to 10 at once to ask across them.
      Select any text to summarize, explain or translate it, or use ❀ to ask about the whole document.</p>
  </main>
  <!-- Same order as manifest content_scripts, so the toolbar, launcher and page tasks work here too. -->
  <script src="content-start.js"></script>
  <script src="content.js"></script>
  <script src="vendor/reading/mammoth.browser.min.js"></script>
  <script type="module" src="reader.js"></script>
</body>
</html>
