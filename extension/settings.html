<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Homegrown settings</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
<main>
  <h1>Homegrown settings</h1>
  <p class="muted">Models are chosen in the side panel's Models tab. <a href="library.html">Open your library</a></p>

  <fieldset>
    <legend>On pages</legend>
    <label class="toggle"><input type="checkbox" data-key="toolbar" data-default="true"><span>Toolbar when I select text or point at an image</span></label>
    <label class="toggle"><input type="checkbox" data-key="fab" data-default="true"><span>✦ button on pages</span></label>
    <label class="toggle"><input type="checkbox" data-key="ghostText" data-default="false"><span>Ghost text: grey suggestions as I type, accepted with Tab</span></label>
    <label class="toggle"><input type="checkbox" data-key="gistMargins" data-default="false"><span>Gist margins: one-line summaries beside sections of long articles</span></label>
    <label class="toggle"><input type="checkbox" data-key="autoAltText" data-default="false"><span>Describe images that have no alt text, for screen readers</span></label>
    <label class="toggle"><input type="checkbox" data-key="searchAnswers" data-default="true"><span>Answer beside search results</span></label>
    <label class="toggle"><input type="checkbox" data-key="linkPreview" data-default="true"><span>Link preview when you hold a link</span></label>
    <label class="toggle"><input type="checkbox" data-key="useVoice" data-default="true"><span>Voice: "Speak…" in the launcher and "Read aloud" on answers</span></label>
    <label class="toggle"><input type="checkbox" data-key="replyButtons" data-default="true"><span>Reply button in email and chat boxes</span></label>
    <label class="row" style="margin-top:8px">Translate into <input id="translateTo" style="max-width:220px" aria-label="Translate into language"></label>
  </fieldset>

  <fieldset>
    <legend>Turned off on these sites</legend>
    <ul id="sites" class="items"></ul>
    <form id="site-form" class="row" style="margin-top:8px"><input id="site" placeholder="example.com" aria-label="Site to turn off"><button>Add</button></form>
  </fieldset>

  <fieldset>
    <legend>Savings</legend>
    <p id="savings" class="muted"></p>
  </fieldset>
</main>
<script type="module" src="settings.js"></script>
</body>
</html>
